<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>멀티 에이전트 오케스트레이션 대시보드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="dashboard-header">
    <h1>멀티 에이전트 오케스트레이션 대시보드</h1>
    <button id="darkModeToggle" class="btn btn--ghost">🌙 다크</button>
  </header>

  <section class="dashboard-summary" aria-label="대시보드 요약">
    <div class="summary-card">
      <span>에이전트</span>
      <strong id="summaryAgents">0</strong>
      <small id="summaryAgentsMeta">실행중 0 · 완료 0</small>
    </div>
    <div class="summary-card">
      <span>작업</span>
      <strong id="summaryTasks">0</strong>
      <small id="summaryTasksMeta">진행중 0 · 대기 0</small>
    </div>
    <div class="summary-card">
      <span>로그</span>
      <strong id="summaryLogs">0</strong>
      <small id="summaryLogsMeta">최근 활동</small>
    </div>
    <div class="summary-card">
      <span>전략</span>
      <strong id="summaryStrategies">0</strong>
      <small id="summaryStrategiesMeta">선택됨 0</small>
    </div>
  </section>

  <main class="dashboard-grid">
    <section class="panel panel--agents">
      <div class="panel__header"><h2>에이전트</h2></div>
      <div class="panel__body">
        <div class="agent-filter">
          <button class="agent-filter__btn active" data-filter="all">전체</button>
          <button class="agent-filter__btn" data-filter="idle">대기</button>
          <button class="agent-filter__btn" data-filter="running">실행중</button>
          <button class="agent-filter__btn" data-filter="done">완료</button>
          <button class="agent-filter__btn" data-filter="error">오류</button>
        </div>
        <div class="agent-cards" id="agentCards"></div>
      </div>
    </section>

    <section class="panel panel--tasks">
      <div class="panel__header"><h2>작업 목록</h2></div>
      <div class="panel__body">
        <div class="panel__toolbar">
          <input
            id="taskSearch"
            type="search"
            class="search-input"
            placeholder="제목, 요약, 담당자 검색..."
            aria-label="작업 검색"
            autocomplete="off"
          >
          <div class="task-filter" role="group" aria-label="작업 상태 필터">
            <button class="task-filter__btn active" data-task-filter="all" type="button">전체</button>
            <button class="task-filter__btn" data-task-filter="pending" type="button">대기</button>
            <button class="task-filter__btn" data-task-filter="in-progress" type="button">진행중</button>
            <button class="task-filter__btn" data-task-filter="done" type="button">완료</button>
            <button class="task-filter__btn" data-task-filter="blocked" type="button">차단</button>
          </div>
        </div>
        <ul class="task-list" id="taskList"></ul>
        <div class="task-detail" id="taskDetail" aria-live="polite">
          <span class="task-detail__empty">작업을 선택하면 상세 정보가 표시됩니다.</span>
        </div>
      </div>
    </section>

    <section class="panel panel--logs">
      <div class="panel__header"><h2>로그 / 메모</h2></div>
      <div class="panel__body">
        <div class="log-section">
          <div class="log-section__header">
            <span class="log-section__title">실행 로그</span>
            <div class="log-section__actions">
              <button id="addLogBtn" class="btn btn--ghost btn--sm" type="button">+ info</button>
              <button id="addWarnLogBtn" class="btn btn--ghost btn--sm" type="button">+ warn</button>
            </div>
          </div>
          <div class="log-filter" role="group" aria-label="로그 레벨 필터">
            <button class="log-filter__btn active" data-log-filter="all" type="button">전체</button>
            <button class="log-filter__btn" data-log-filter="info" type="button">info</button>
            <button class="log-filter__btn" data-log-filter="warn" type="button">warn</button>
            <button class="log-filter__btn" data-log-filter="error" type="button">error</button>
          </div>
          <div class="log-list" id="logList" aria-live="polite"></div>
        </div>
        <div class="memo-section">
          <div class="log-section__title">메모</div>
          <textarea
            id="memoInput"
            class="memo-input"
            placeholder="메모를 입력하세요..."
            rows="3"
          ></textarea>
          <div class="memo-actions">
            <button id="saveMemoBtn" class="btn btn--ghost btn--sm">저장</button>
          </div>
          <div id="memoDisplay" class="memo-display"></div>
        </div>
      </div>
    </section>

    <section class="panel panel--strategy">
      <div class="panel__header"><h2>모델 전략</h2></div>
      <div class="panel__body">
        <ul class="strategy-list" id="strategyList"></ul>
        <div class="strategy-desc" id="strategyDesc">
          <span class="strategy-desc__empty">전략을 선택하면 설명이 표시됩니다.</span>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
